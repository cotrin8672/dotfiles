[tools]
fd = "latest"
bun = "latest"
go = "latest"
node = "22.23.4"
"npm:typescript" = "latest"
pnpm = "latest"
rg = "latest"
"npm:@dotenvx/dotenvx" = "latest"
"npm:@playwright/cli" = "latest"
zoxide = "latest"
ghq = "latest"
zig = "latest"
"npm:@github/copilot" = "latest"
rust = "latest"
java = "openjdk-21"
fzf = "latest"
deno = "latest"
uv = "latest"
python = "latest"
"pipx:pylatexenc" = "latest"
eza = "latest"
dust = "latest"
delta = "latest"
bat = "latest"
direnv = "latest"
lazygit = "latest"
gh = "latest"
cmake = "latest"
1password-cli = "latest"
yq = "latest"
jq = "latest"
tree-sitter = "latest"
lefthook = "latest"
gradle = "latest"
carapace = "latest"
"github:anomalyco/opencode" = "latest"
"github:cordx56/rustowl" = "0.4.0"
zellij = "latest"
ast-index = "3.56.0"
"github:cotrin8672/opencodex" = { version = "2.95.0-claude-json.5", version_prefix = "v", asset_pattern = "ocx-2.95.0-claude-json.5-bun-windows-x64.zip", bin_path = "." }
"npm:@openai/codex" = "latest"
julia = { version = "latest", checksum_expr = '"sha256:" + filter(fromJSON(body)[version + ""].files, { #.url == url })[0].sha256', checksum_url = "https://julialang-s3.julialang.org/bin/versions.json", platforms = { linux-arm64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/linux/aarch64/julia-latest-linuxaarch64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/linux/aarch64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-linux-aarch64.tar.gz{% endif %}""" }, linux-x64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/linux/x64/julia-latest-linux64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/linux/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-linux-x86_64.tar.gz{% endif %}""" }, macos-arm64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/mac/aarch64/julia-latest-macaarch64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/mac/aarch64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-macaarch64.tar.gz{% endif %}""" }, macos-x64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/mac/x64/julia-latest-mac64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/mac/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-mac64.tar.gz{% endif %}""" }, windows-x64 = { format = "zip", url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/winnt/x64/julia-latest-win64.zip{% else %}https://julialang-s3.julialang.org/bin/winnt/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-win64.zip{% endif %}""" } }, version_expr = 'sortVersions(filter(keys(fromJSON(body)), { # matches "^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z\\.-]+)?$" }))', version_list_url = "https://julialang-s3.julialang.org/bin/versions.json" }

[tools.codixing]
version = "0.48.0"
matching_regex = "^codixing-(linux|macos|windows)-"
bin = "codixing"
platforms.windows-x64.bin = "codixing.exe"

[tools.codixing-mcp]
version = "0.48.0"
matching = "codixing-mcp-"
bin = "codixing-mcp"
platforms.windows-x64.bin = "codixing-mcp.exe"

[tool_alias]
codixing = "github:ferax564/codixing"
codixing-mcp = "github:ferax564/codixing"
ast-index = "github:defendend/Claude-ast-index-search"

[tasks.codex-code-search-install]
description = "Restore Codixing, ast-index, and language server plugins for Codex on Windows"
run = 'powershell -NoProfile -ExecutionPolicy Bypass -File "{{ env.USERPROFILE }}/.codex/install-code-search.ps1"'

[tasks.nvim-startuptime-install]
description = "Install vim-startuptime via go install"
run = "go install github.com/rhysd/vim-startuptime@latest"

[tasks.nvim-startuptime]
description = "Measure Neovim startup time with vim-startuptime"
run = "vim-startuptime -vimpath nvim +qall"

[settings]
experimental = true
