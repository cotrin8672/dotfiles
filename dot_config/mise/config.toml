[tools]
fd = "latest"
bun = "latest"
go = "latest"
node = "22"
"npm:typescript" = "latest"
pnpm = "latest"
rg = "latest"
"npm:@dotenvx/dotenvx" = "latest"
"npm:@playwright/cli" = "latest"
zoxide = "latest"
ghq = "latest"
zig = "latest"
"npm:@github/copilot" = "latest"
rust = "latest"
java = "openjdk-21"
fzf = "latest"
deno = "latest"
uv = "latest"
python = "latest"
"pipx:pylatexenc" = "latest"
eza = "latest"
dust = "latest"
delta = "latest"
bat = "latest"
direnv = "latest"
lazygit = "latest"
gh = "latest"
cmake = "latest"
1password-cli = "latest"
yq = "latest"
jq = "latest"
tree-sitter = "latest"
lefthook = "latest"
gradle = "latest"
carapace = "latest"
"github:anomalyco/opencode" = "latest"
"github:cordx56/rustowl" = "0.4.0"
zellij = "latest"
ast-index = "3.56.0"

[tools.codixing]
version = "0.48.0"
matching_regex = "^codixing-(linux|macos|windows)-"
bin = "codixing"
platforms.windows-x64.bin = "codixing.exe"

[tools.codixing-mcp]
version = "0.48.0"
matching = "codixing-mcp-"
bin = "codixing-mcp"
platforms.windows-x64.bin = "codixing-mcp.exe"

[tool_alias]
codixing = "github:ferax564/codixing"
codixing-mcp = "github:ferax564/codixing"
ast-index = "github:defendend/Claude-ast-index-search"

[tasks.codex-code-search-install]
description = "Restore Codixing, ast-index, and language server plugins for Codex on Windows"
run = 'powershell -NoProfile -ExecutionPolicy Bypass -File "{{ env.USERPROFILE }}/.codex/install-code-search.ps1"'

[tasks.nvim-startuptime-install]
description = "Install vim-startuptime via go install"
run = "go install github.com/rhysd/vim-startuptime@latest"

[tasks.nvim-startuptime]
description = "Measure Neovim startup time with vim-startuptime"
run = "vim-startuptime -vimpath nvim +qall"

[settings]
experimental = true
