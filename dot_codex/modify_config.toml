{{- /* chezmoi:modify-template */ -}}
{{- /* Preserve machine-local state; only the keys below are managed. */ -}}
{{- $input := .chezmoi.stdin -}}
{{- $targetPath := joinPath .chezmoi.destDir ".codex" "config.toml" -}}
{{- $target := lstat $targetPath -}}
{{- if and (not $input) $target (eq $target.type "symlink") (not (stat $targetPath)) -}}
{{- /* A pull can leave the old config link dangling after its source is deleted. */ -}}
{{- $revision := output "git" "-C" .chezmoi.sourceDir "log" "-1" "--format=%H" "--diff-filter=AM" "--" "dot_codex/config.toml" | trim -}}
{{- if not $revision -}}{{ fail "Cannot recover the old Codex config from Git history; restore the linked config before applying." }}{{- end -}}
{{- $input = output "git" "-C" .chezmoi.sourceDir "show" (printf "%s:dot_codex/config.toml" $revision) -}}
{{- end -}}
{{- $config := fromToml $input -}}
{{- $config = $config
  | setValueAtPath "cli_auth_credentials_store" "file"
  | setValueAtPath "model" "gpt-6.1-sol"
  | setValueAtPath "model_reasoning_effort" "max"
  | setValueAtPath "approval_policy" "never"
  | setValueAtPath "approvals_reviewer" "user"
  | setValueAtPath "sandbox_mode" "danger-full-access"
  | setValueAtPath "model_catalog_json" (joinPath .chezmoi.homeDir ".codex" "opencodex-catalog.json")
  | setValueAtPath "openai_base_url" "http://127.0.0.1:10100/v1"
  | setValueAtPath "experimental_realtime_ws_base_url" "http://127.0.0.1:10100/v1"
  | setValueAtPath "desktop.keepRemoteControlAwakeWhilePluggedIn" true
  | setValueAtPath "desktop.composerEnterBehavior" "enter"
  | setValueAtPath "desktop.appearanceDarkCodeThemeId" "monokai"
  | setValueAtPath "desktop.appearanceDarkChromeTheme.contrast" 60
  | setValueAtPath "desktop.appearanceDarkChromeTheme.opaqueWindows" true
  | setValueAtPath "desktop.appearanceDarkChromeTheme.fonts.code" "\"Hack Nerd Font Mono\""
  | deleteValueAtPath "desktop.appearanceDarkChromeTheme.fonts.content"
-}}
{{- range $name := list "ast-index-plugins" "codixing-local" -}}
{{- $config = setValueAtPath (list "marketplaces" $name "source") (joinPath $.chezmoi.homeDir ".codex" "plugin-sources" $name) $config -}}
{{- end -}}
{{- $config | toToml -}}
